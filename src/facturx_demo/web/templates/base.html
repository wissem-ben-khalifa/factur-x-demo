<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Factur-X demo{% endblock %}</title>
  <style>
    :root {
      --bg: #fafaf8; --card: #ffffff; --text: #1c1c1a; --muted: #6a6a64; --line: #deded8;
      --accent: #1d4ed8; --ok: #166534; --ok-bg: #e7f5ec; --bad: #991b1b; --bad-bg: #fbeaea;
      --warn: #8a5a00; --warn-bg: #fdf3dc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413; --card: #1d1d1b; --text: #ecece8; --muted: #9a9a92; --line: #33332f;
        --accent: #7aa2ff; --ok: #6ee79a; --ok-bg: #12301f; --bad: #ff9b9b; --bad-bg: #3a1818;
        --warn: #f0c36a; --warn-bg: #382c10;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text);
           font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; }
    h2 { font-size: 1.05rem; margin: 0 0 12px; }
    p.sub { color: var(--muted); margin: 0 0 20px; }
    section, .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
                     padding: 16px; margin-bottom: 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: 2px; }
    input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--line);
      border-radius: 6px; background: var(--bg); color: var(--text); font: inherit; }
    textarea { min-height: 52px; resize: vertical; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: .8rem; color: var(--muted); font-weight: 500; padding: 0 6px 4px 0; }
    td { padding: 3px 6px 3px 0; vertical-align: top; }
    .btn { display: inline-block; background: var(--accent); color: #fff; border: 0; border-radius: 6px;
           padding: 9px 16px; font: inherit; cursor: pointer; text-decoration: none; }
    .btn.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
    .samples a { color: var(--accent); margin-right: 12px; }
    .issues { background: var(--bad-bg); border-color: var(--bad); }
    .issues li { margin-bottom: 8px; }
    .issues .en { color: var(--muted); display: block; }
    .issues code, .finding code { font-size: .75rem; color: var(--muted); }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: .85rem; font-weight: 600; }
    .badge.ok { background: var(--ok-bg); color: var(--ok); }
    .badge.bad { background: var(--bad-bg); color: var(--bad); }
    .badge.warn { background: var(--warn-bg); color: var(--warn); }
    .finding { border-top: 1px solid var(--line); padding: 8px 0; font-size: .9rem; }
    .finding.error { color: var(--bad); }
    .finding.warning { color: var(--warn); }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    footer { color: var(--muted); font-size: .8rem; margin-top: 24px; }
  </style>
</head>
<body>
<main>
  {% block content %}{% endblock %}
  <footer>Démo avec des entreprises fictives / Demo with fictional companies only. Not legal or tax advice.</footer>
</main>
</body>
</html>
